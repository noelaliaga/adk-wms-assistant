name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # The MCP server this agent drives lives in its own repository.
      # If that repository is private, add a read-only fine-grained token as
      # the MCP_LOGISTICA_TOKEN secret; the default token cannot read it.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mcp-logistica
          path: .deps/mcp-logistica
          token: ${{ secrets.MCP_LOGISTICA_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .deps/mcp-logistica/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .deps/mcp-logistica
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy --strict)
        if: matrix.python-version == '3.12'
        run: mypy

      - name: Tests (offline, scripted model, real stdio server)
        run: pytest
